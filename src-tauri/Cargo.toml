[package]
name = "grove"
# === アプリのバージョン番号（一次ソース） ===
# tauri.conf.json は `version` を省略しているため、Tauri は自動的にここを参照する。
# フロントエンドは @tauri-apps/api/app の getVersion() で同値を実行時取得する
# （src/components/Sidebar.tsx）。リリーススクリプト（scripts/release-beta.sh）
# もこのファイルから抽出する。
# 同期メモ: package.json の `version` は npm エコシステム都合で残しており、リリース時
# に手動で合わせる運用（cargo-edit + pnpm version などのスクリプト化は未対応）。
version = "0.2.0"
description = "Git Worktree Manager GUI with Claude Code agent visibility"
authors = ["chieeeeno"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "grove_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.20", features = ["vendored-openssl"] }
# fetch_repository のタイムアウト制御に使用（Tauri 2 が内部で使う tokio と同系列）
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

