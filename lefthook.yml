pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: "*.{ts,tsx}"
      run: pnpm oxlint {staged_files}
    prettier:
      glob: "*.{ts,tsx}"
      run: pnpm prettier --write {staged_files}
      stage_fixed: true
    rustfmt:
      glob: "*.rs"
      run: $HOME/.cargo/bin/cargo fmt --manifest-path src-tauri/Cargo.toml
      stage_fixed: true
    clippy:
      glob: "*.rs"
      run: $HOME/.cargo/bin/cargo clippy --manifest-path src-tauri/Cargo.toml --lib -- -D warnings
